name: NODEOS-001 Contract
on:
  push:
    branches: [main, codex/nodeos-001-bootstrap]
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository layout and contracts
        run: python3 scripts/verify-layout.py
      - name: Parse shell scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find scripts buildroot -type f \( -name '*.sh' -o -path '*/etc/init.d/S*' -o -name 'nodeos-agent' -o -name 'nodeos-cuda-smoke' \) -print0)
      - name: Validate Buildroot defconfig
        run: ./scripts/build-nodeos.sh --configure-only
