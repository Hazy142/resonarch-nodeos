NODEOS_NODE_ID=haswell-gtx1070ti-01
NODEOS_LINK_MODE=static
NODEOS_INTERFACE=
NODEOS_IPV4_CIDR=192.168.77.2/30
NODEOS_PEER_IPV4=192.168.77.1
NODEOS_AGENT_INTERVAL=10

# --- NODEOS-001-LAB -------------------------------------------------------
# The direct-LAN peer must answer before the node counts as NODE_READY.
NODEOS_REQUIRE_PEER=1
NODEOS_MIN_LINK_MBIT=1000
NODEOS_MIN_THROUGHPUT_MBIT=800
NODEOS_IPERF_SECONDS=5
NODEOS_IPERF_SERVER=1
# SSH (key-only, only if a key was baked in) listens on the direct-LAN address only.
NODEOS_SSH_LISTEN=192.168.77.2
# Automatic evidence bundle once the state has been stable for N agent cycles.
NODEOS_EVIDENCE_AUTO=1
NODEOS_EVIDENCE_STABLE_CYCLES=3
